<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D4A853"/>
      <stop offset="50%" style="stop-color:#F0D48A"/>
      <stop offset="100%" style="stop-color:#D4A853"/>
    </linearGradient>
    <linearGradient id="duneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A853"/>
      <stop offset="100%" style="stop-color:#B45309"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:transparent"/>
      <stop offset="20%" style="stop-color:#D4A853"/>
      <stop offset="80%" style="stop-color:#D4A853"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </linearGradient>
  </defs>

  <!-- Desert dunes icon -->
  <g transform="translate(200, 8)">
    <!-- Back dune (larger) -->
    <path d="M-40,40 Q-25,12 0,22 Q25,32 35,18 Q42,28 50,40 Z" fill="url(#duneGrad)" opacity="0.4"/>
    <!-- Front dune (main) -->
    <path d="M-50,40 Q-30,18 -5,28 Q15,8 35,28 Q48,20 55,40 Z" fill="url(#duneGrad)" opacity="0.8"/>
    <!-- Sun/moon circle -->
    <circle cx="30" cy="10" r="6" fill="#D4A853" opacity="0.6"/>
    <!-- Small star -->
    <circle cx="-20" cy="8" r="1.5" fill="#F0D48A" opacity="0.5"/>
    <circle cx="-10" cy="3" r="1" fill="#F0D48A" opacity="0.4"/>
  </g>

  <!-- Top decorative line -->
  <line x1="100" y1="52" x2="300" y2="52" stroke="url(#lineGrad)" stroke-width="1" opacity="0.5"/>

  <!-- ERG -->
  <text x="200" y="80" text-anchor="middle" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="36" font-weight="800" letter-spacing="12" fill="url(#goldGrad)">ERG</text>

  <!-- CHEGAGA -->
  <text x="200" y="104" text-anchor="middle" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="20" font-weight="500" letter-spacing="14" fill="#F5F5F4">CHEGAGA</text>

  <!-- Bottom decorative line -->
  <line x1="100" y1="112" x2="300" y2="112" stroke="url(#lineGrad)" stroke-width="1" opacity="0.5"/>
</svg>
